<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<title>Claude</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app" class="stage">
  <div class="blob-area">
    <div id="blob" class="blob">
      <canvas id="blobCanvas" aria-hidden="true"></canvas>

      <div class="term">
        <div class="term-head">
          <span class="dots"><i id="conn" class="conn"></i><i></i><i></i></span>
          <span id="tHead">claude ~</span>
        </div>
        <div id="tBody" class="term-body" aria-live="polite">
          <div id="lines"></div>
          <div id="tLive" class="ln out md" hidden></div>
          <div id="tTail" class="ln tail"></div>
        </div>
      </div>

      <div id="pill" class="pill">
        <div id="pillInput" class="pill-row">
          <textarea id="input" rows="1" placeholder="Řekni nebo napiš…" enterkeyhint="send"></textarea>
          <button id="actBtn" class="gbtn"><span id="actLabel">Mluv</span><span id="actIcon" class="ico"></span></button>
        </div>
        <div id="pillChoice" class="pill-row choice" hidden>
          <span id="choiceLabel" class="choice-label">Povolit?</span>
          <button id="noBtn" class="gbtn ghost">Ne</button>
          <button id="alwaysBtn" class="gbtn ghost">Vždy</button>
          <button id="yesBtn" class="gbtn">Povolit <span class="ico">⏎</span></button>
        </div>
      </div>
    </div>
    <div class="blob-shadow"></div>
  </div>

  <div class="under">
    <div id="soundSeg" class="seg" role="group" aria-label="Zvuk">
      <span class="seg-label">
        <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        Zvuk
      </span>
      <button data-v="on">Zap</button>
      <button data-v="off">Vyp</button>
    </div>
    <nav class="links">
      <button id="menuBtn">Konverzace<span id="menuBadge" class="badge" hidden></span></button>
      <span>·</span>
      <button id="newQuickBtn">Nová</button>
      <span>·</span>
      <button id="settingsBtn">Nastavení</button>
    </nav>
  </div>
</div>

<section id="login" class="login" hidden>
  <h1>Připoj se ke svému počítači</h1>
  <p id="loginMsg">Otevři odkaz, který ti ukázal počítač, nebo sem vlož odkaz či kód.</p>
  <input id="tokenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Odkaz nebo kód">
  <button id="tokenBtn" class="btn primary">Připojit</button>
</section>

<dialog id="drawer" class="drawer">
  <div class="dlg">
    <div class="dlg-head"><h2>Konverzace</h2><button class="x" data-close aria-label="Zavřít">✕</button></div>
    <button id="newBtn" class="btn primary wide">Nová konverzace</button>
    <button id="newFolderBtn" class="btn wide">Nová v jiné složce</button>
    <div id="sessList" class="sess-list"></div>
  </div>
</dialog>

<dialog id="newDlg" class="sheet">
  <div class="dlg">
    <div class="dlg-head"><h2>Vyber složku</h2><button class="x" data-close aria-label="Zavřít">✕</button></div>
    <div id="recent" class="chips"></div>
    <div id="cwdPath" class="cwd-path"></div>
    <div id="dirList" class="dir-list"></div>
    <button id="startHereBtn" class="btn primary wide">Začít tady</button>
  </div>
</dialog>

<dialog id="settingsDlg" class="sheet">
  <div class="dlg">
    <div class="dlg-head"><h2>Nastavení</h2><button class="x" data-close aria-label="Zavřít">✕</button></div>
    <div id="qrBox" class="qr-box" hidden>
      <img id="qrImg" alt="QR kód s odkazem na tuto aplikaci" width="180" height="180">
      <p class="hint">Tvůj odkaz – naskenuj mobilem a ulož si ho na plochu.</p>
      <a id="linkOut" class="link-out" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <label class="row-set"><span>Ptát se před akcemi<small>Vypnuto = Claude udělá cokoliv sám</small></span><input id="setAsk" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Po dodiktování odeslat</span><input id="setAutoSend" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Zavibrovat, když je hotovo</span><input id="setVibrate" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Nezhasínat displej při práci</span><input id="setWake" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Jazyk</span>
      <select id="setLang">
        <option value="cs-CZ">Čeština</option>
        <option value="sk-SK">Slovenčina</option>
        <option value="en-US">English</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </label>
    <label class="row-set col"><span>Rychlost čtení <b id="rateVal"></b></span>
      <input id="setRate" type="range" min="0.7" max="1.6" step="0.05">
    </label>
    <button id="logoutBtn" class="btn danger wide">Odpojit toto zařízení</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>
</body>
</html>
