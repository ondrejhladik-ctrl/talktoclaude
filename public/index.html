<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<title>Claude</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="app">
  <header class="top">
    <nav class="pill">
      <button id="menuBtn" class="nav-btn" aria-label="Konverzace">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 9h14M5 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span id="menuBadge" class="badge" hidden></span>
      </button>
      <span class="nav-title"><span id="conn" class="conn"></span><span id="title">Claude</span></span>
      <button id="newQuickBtn" class="nav-btn" aria-label="Nová konverzace">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </nav>
    <div id="subText" class="sub">Připojuji…</div>
  </header>

  <main id="messages" class="messages">
    <section id="empty" class="empty" hidden>
      <button id="orbBtn" class="orb-btn" aria-label="Klepni a mluv"><span class="orb"></span></button>
      <p class="hello">Ahoj, tady Claude.<br><span>Řekni mi, co mám na počítači udělat.</span></p>
      <div class="suggestions">
        <button class="sugg">Co je v téhle složce?</button>
        <button class="sugg">Najdi v projektu chyby a oprav je</button>
        <button class="sugg">Shrň, na čem jsem naposledy pracoval</button>
      </div>
      <div id="emptyCwd" class="empty-cwd"></div>
    </section>
    <div id="list"></div>
    <div id="live" class="msg assistant md live" hidden></div>
    <div id="working" class="working" hidden><span class="orb tiny"></span><span id="workingText">Pracuju…</span></div>
  </main>

  <footer class="composer">
    <div id="speaking" class="speaking" hidden>
      <span>Předčítám odpověď</span><button id="stopSpeakBtn" class="link-btn">Ztlumit</button>
    </div>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="Napiš, nebo klepni na mikrofon…" enterkeyhint="send"></textarea>
      <button id="micBtn" class="round mic" aria-label="Mluvit">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="3.5" width="6" height="10.5" rx="3" fill="currentColor"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0M12 17.4v3.1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="sendBtn" class="round send" aria-label="Odeslat" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 18.5V5.5M6.5 11 12 5.5 17.5 11" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="stopBtn" class="round stop" aria-label="Zastavit" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
      </button>
    </div>
  </footer>
</div>

<section id="login" class="login" hidden>
  <span class="orb"></span>
  <h1>Připoj se ke svému počítači</h1>
  <p id="loginMsg">Otevři odkaz, který ti ukázal počítač, nebo sem vlož odkaz či kód.</p>
  <input id="tokenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Odkaz nebo kód">
  <button id="tokenBtn" class="btn primary">Připojit</button>
</section>

<dialog id="drawer" class="drawer">
  <div class="dlg">
    <div class="dlg-head"><h2>Konverzace</h2><button class="nav-btn" data-close aria-label="Zavřít">✕</button></div>
    <button id="newBtn" class="btn primary wide">Nová konverzace</button>
    <button id="newFolderBtn" class="btn ghost wide">Nová v jiné složce</button>
    <div id="sessList" class="sess-list"></div>
    <button id="settingsBtn" class="btn ghost wide">Nastavení</button>
  </div>
</dialog>

<dialog id="newDlg" class="sheet">
  <div class="dlg">
    <div class="dlg-head"><h2>Vyber složku</h2><button class="nav-btn" data-close aria-label="Zavřít">✕</button></div>
    <div id="recent" class="chips"></div>
    <div id="cwdPath" class="cwd-path"></div>
    <div id="dirList" class="dir-list"></div>
    <button id="startHereBtn" class="btn primary wide">Začít tady</button>
  </div>
</dialog>

<dialog id="settingsDlg" class="sheet">
  <div class="dlg">
    <div class="dlg-head"><h2>Nastavení</h2><button class="nav-btn" data-close aria-label="Zavřít">✕</button></div>
    <div id="qrBox" class="qr-box" hidden>
      <img id="qrImg" alt="QR kód s odkazem na tuto aplikaci" width="200" height="200">
      <p class="hint">Tvůj odkaz – naskenuj mobilem a ulož si ho na plochu.</p>
      <a id="linkOut" class="link-out" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <label class="row-set"><span>Ptát se před akcemi<small>Vypnuto = Claude udělá cokoliv sám</small></span><input id="setAsk" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Po dodiktování odeslat</span><input id="setAutoSend" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Zavibrovat, když je hotovo</span><input id="setVibrate" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Nezhasínat displej při práci</span><input id="setWake" type="checkbox" class="switch"></label>
    <label class="row-set"><span>Číst odpovědi nahlas</span>
      <select id="setSpeak">
        <option value="voice">Když mluvím</option>
        <option value="always">Vždy</option>
        <option value="never">Nikdy</option>
      </select>
    </label>
    <label class="row-set"><span>Jazyk</span>
      <select id="setLang">
        <option value="cs-CZ">Čeština</option>
        <option value="sk-SK">Slovenčina</option>
        <option value="en-US">English</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </label>
    <label class="row-set col"><span>Rychlost čtení <b id="rateVal"></b></span>
      <input id="setRate" type="range" min="0.7" max="1.6" step="0.05">
    </label>
    <button id="logoutBtn" class="btn ghost danger wide">Odpojit toto zařízení</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>
</body>
</html>
